tailwind.config={darkMode:"class",theme:{extend:{
colors:{primary:"#a5e7ff","on-surface":"#e5e2e1","on-surface-variant":"#bbc9cf","surface-container":"#201f1f","surface-container-low":"#1c1b1b","surface-dim":"#131313","secondary-fixed-dim":"#e9c349"},
spacing:{"margin-mobile":"20px","margin-desktop":"64px","gutter":"24px","container-max":"1440px"},
fontFamily:{"mono-ui":["Geist"],"label-caps":["Geist"],"headline-sm":["Playfair Display"],"headline-md":["Playfair Display"],"display-lg-mobile":["Playfair Display"],"body-md":["Geist"],"display-lg":["Playfair Display"]},
fontSize:{"mono-ui":["13px",{lineHeight:"1.2",letterSpacing:"0.05em",fontWeight:"500"}],"label-caps":["12px",{lineHeight:"1",letterSpacing:"0.1em",fontWeight:"600"}],"headline-sm":["24px",{lineHeight:"1.4",fontWeight:"600"}],"headline-md":["32px",{lineHeight:"1.3",fontWeight:"600"}],"display-lg-mobile":["40px",{lineHeight:"1.2",fontWeight:"700"}],"body-md":["16px",{lineHeight:"1.6",fontWeight:"400"}],"display-lg":["64px",{lineHeight:"1.1",letterSpacing:"-0.02em",fontWeight:"700"}]}

<style>
:root{--cyan:#a5e7ff;--gold:#e9c349;--ink:#050505}
*{box-sizing:border-box}
html{background:#050505;scroll-behavior:smooth}
body{margin:0;background:#050505;color:#e5e2e1;overflow-x:hidden;font-family:Geist,Tajawal,Vazirmatn,sans-serif;padding-bottom:max(124px,calc(110px + env(safe-area-inset-bottom)))}
.ambient-aurora{position:fixed;inset:-50%;width:200%;height:200%;background:radial-gradient(circle at 50% 50%,rgba(0,210,255,.05),transparent 50%),radial-gradient(circle at 20% 80%,rgba(165,231,255,.03),transparent 40%);z-index:-2;pointer-events:none;animation:drift 30s linear infinite alternate}
.film-grain{position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:.02;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");mix-blend-mode:overlay}
@keyframes drift{to{transform:translate(-2%,3%) scale(1.05)}}
.glass-panel{background:rgba(255,255,255,.03);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,.05)}
.glass-panel-interactive{transition:.35s ease}
.glass-panel-interactive:hover{background:rgba(255,255,255,.075);border-color:rgba(165,231,255,.3);box-shadow:0 0 26px rgba(165,231,255,.1);transform:translateY(-3px)}
.song-wave{position:relative;width:100%;height:128px;border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:rgba(32,31,31,.52);border:1px solid rgba(255,255,255,.05)}
.song-wave img,.song-wave iframe{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover}
.song-wave img{opacity:.48;filter:saturate(.78) contrast(1.08);transition:.4s ease}
.song-card:hover .song-wave img{opacity:.65;transform:scale(1.025)}
.wave-bars{position:relative;z-index:2;display:flex;align-items:center;gap:4px;height:50px;padding:0 15px;border-radius:999px;background:rgba(4,10,15,.45);backdrop-filter:blur(10px)}
.wave-bars i{display:block;width:4px;border-radius:999px;background:var(--cyan);box-shadow:0 0 10px rgba(165,231,255,.28);animation:wave 1.1s ease-in-out infinite alternate}
.wave-bars i:nth-child(2){animation-duration:1.35s}.wave-bars i:nth-child(3){animation-duration:.9s}.wave-bars i:nth-child(4){animation-duration:1.55s}.wave-bars i:nth-child(5){animation-duration:1.15s}.wave-bars i:nth-child(6){animation-duration:.82s}.wave-bars i:nth-child(7){animation-duration:1.3s}
@keyframes wave{from{height:12%}to{height:92%}}
.song-index{position:absolute;top:12px;left:12px;z-index:3;padding:6px 9px;border-radius:999px;border:1px solid rgba(165,231,255,.18);background:rgba(3,8,13,.72);color:#a5e7ff;font:600 9px Geist;letter-spacing:.1em}
.song-source{font:500 11px/1.4 Geist;color:#8798a1;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-story{margin-top:13px;padding-top:13px;border-top:1px solid rgba(255,255,255,.055);color:#9fb0b9;font:400 13px/1.8 Tajawal,Geist,sans-serif;white-space:pre-wrap}
.player-row{display:flex;align-items:center;gap:12px;color:#aebbc2;font:500 11px Geist}
.progress{appearance:none;-webkit-appearance:none;width:100%;height:2px;background:rgba(255,255,255,.18);border-radius:999px;outline:none}
.progress::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#a5e7ff;box-shadow:0 0 10px rgba(165,231,255,.8)}
.controls{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.controls button{border:0;background:transparent;color:#a9b7bd;cursor:pointer;transition:.25s ease}
.controls button:hover{color:#a5e7ff;transform:translateY(-2px)}
.controls .play{font-size:42px;color:#a5e7ff;border-radius:50%;text-shadow:0 0 18px rgba(165,231,255,.32)}
.controls .play.is-playing{color:#e9c349;text-shadow:0 0 18px rgba(233,195,73,.35)}
.song-link{display:inline-flex;align-items:center;gap:5px;color:#77dfff;text-decoration:none;font:500 11px Geist;margin-top:11px}
.song-link:hover{text-decoration:underline}
#song-more{display:block;margin:28px auto 0;padding:12px 22px;border:1px solid rgba(165,231,255,.26);border-radius:999px;background:rgba(165,231,255,.06);color:#a5e7ff;cursor:pointer}
#song-more.hidden{display:none}
.nafsam-dock{position:fixed;z-index:9998;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:6px;width:min(94vw,720px);padding:8px;border:1px solid rgba(155,232,255,.18);border-radius:28px;background:linear-gradient(135deg,rgba(15,23,31,.9),rgba(5,7,10,.8));box-shadow:0 18px 60px rgba(0,0,0,.55);backdrop-filter:blur(24px)}
.nafsam-link{position:relative;flex:1;min-width:0;height:58px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#82929d;text-decoration:none;font:600 9px/1 Geist;letter-spacing:.08em;text-transform:uppercase;transition:.28s}
.nafsam-link .material-symbols-outlined{font-size:21px}.nafsam-link:hover{color:#eafaff;background:rgba(155,232,255,.07);transform:translateY(-3px)}.nafsam-link.active{color:#9be8ff;background:linear-gradient(180deg,rgba(155,232,255,.15),rgba(155,232,255,.05));box-shadow:inset 0 0 0 1px rgba(155,232,255,.22)}
.lang-btn{border:1px solid rgba(165,231,255,.15);background:rgba(5,10,15,.58);color:#a5e7ff;border-radius:999px;padding:8px 10px;cursor:pointer}
@media(max-width:620px){.nafsam-dock{width:calc(100vw - 18px);gap:2px;padding:6px}.nafsam-link{height:54px;font-size:0}.nafsam-link .material-symbols-outlined{font-size:21px}.song-wave{height:116px}}
@media(prefers-reduced-motion:reduce){.ambient-aurora,.wave-bars i{animation:none}}
</style>

.nafsam-fixed-home{position:fixed;z-index:12000;left:max(14px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));width:44px;height:44px;border-radius:16px;display:grid;place-items:center;text-decoration:none;color:#9be8ff;background:linear-gradient(145deg,rgba(10,20,30,.88),rgba(3,8,13,.82));border:1px solid rgba(155,232,255,.22);box-shadow:0 12px 36px rgba(0,0,0,.38),inset 0 1px rgba(255,255,255,.05);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:.25s cubic-bezier(.2,.8,.2,1)}
.nafsam-fixed-home:hover{transform:translateY(-2px) scale(1.04);border-color:rgba(155,232,255,.45);box-shadow:0 16px 44px rgba(0,0,0,.45),0 0 24px rgba(155,232,255,.12)}
.nafsam-fixed-home .material-symbols-outlined{font-size:23px}
@media(max-width:640px){.nafsam-fixed-home{width:42px;height:42px;border-radius:14px}}

<body class="antialiased min-h-screen relative flex flex-col items-center">
<a class="nafsam-fixed-home" href="./home.html" aria-label="Home" title="Home"><span class="material-symbols-outlined">home</span></a>
<div class="ambient-aurora"></div><div class="film-grain"></div>
<header class="fixed top-0 w-full bg-gradient-to-b from-surface-dim/80 to-transparent backdrop-blur-sm flex justify-between items-center px-margin-mobile md:px-margin-desktop h-20 z-50">
  <div class="flex items-center gap-4">
    <h1 class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg tracking-tighter text-primary uppercase">Nafsam</h1>
    <span class="text-on-surface-variant font-mono-ui uppercase mt-2 hidden md:block opacity-60">/// Archive / Songs</span>
  </div>
  <button id="lang-toggle" class="lang-btn" type="button" aria-label="Language"><span class="material-symbols-outlined">language</span></button>
</header>
<main class="w-full max-w-container-max px-margin-mobile md:px-margin-desktop pt-32 md:pt-40 pb-40 flex-grow z-10">
  <div class="mb-12">
    <p id="archive-label" class="font-label-caps text-secondary-fixed-dim tracking-[.22em] mb-3">Archive / Songs</p>
    <h2 id="page-title" class="font-headline-md text-primary mb-2">Resonance Chamber</h2>
    <p id="page-desc" class="font-body-md text-on-surface-variant max-w-2xl">Archived frequencies. Audio logs and musical fragments preserved in the void.</p>
  </div>
  <div class="flex items-center justify-between gap-4 mb-6">
    <span id="song-count" class="font-mono-ui text-primary/70 uppercase tracking-widest">Loading songs…</span>
  </div>
  <div id="songs-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-gutter" aria-live="polite"></div>
  <button id="song-more" type="button" class="hidden">Load more songs</button>
</main>

<script>
(()=>{
 const langs=['ar','fa','tr','en'];
 let lang=(()=>{try{return localStorage.getItem('nafsam_language')||'ar'}catch(e){return 'ar'}})();
 const ui={
  ar:{archive:'الأرشيف / الأغاني',title:'غرفة الصدى',desc:'ترددات محفوظة، أغانٍ وشظايا موسيقية بقيت معلّقة في الذاكرة.',loading:'جارِ تحميل الأغاني…',count:n=>n+' أغنية',more:'تحميل المزيد',open:'تشغيل',source:'YouTube',error:'تعذر تحميل قائمة الأغاني.'},
  fa:{archive:'آرشیو / آهنگ‌ها',title:'اتاق طنین',desc:'فرکانس‌های بایگانی‌شده، آهنگ‌ها و تکه‌های موسیقی که در حافظه مانده‌اند.',loading:'در حال بارگذاری آهنگ‌ها…',count:n=>n+' آهنگ',more:'بیشتر',open:'پخش',source:'YouTube',error:'بارگذاری آهنگ‌ها ممکن نشد.'},
  tr:{archive:'Arşiv / Şarkılar',title:'Rezonans Odası',desc:'Arşivlenmiş frekanslar, ses izleri ve hafızada kalan müzik parçaları.',loading:'Şarkılar yükleniyor…',count:n=>n+' şarkı',more:'Daha fazla',open:'Oynat',source:'YouTube',error:'Şarkılar yüklenemedi.'},
  en:{archive:'Archive / Songs',title:'Resonance Chamber',desc:'Archived frequencies. Audio logs and musical fragments preserved in the void.',loading:'Loading songs…',count:n=>n+' songs',more:'Load more songs',open:'Play',source:'YouTube',error:'The song list could not be loaded.'}
 };
 const T=()=>ui[lang]||ui.en;
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const youtubeId=url=>{try{const u=new URL(String(url));if(u.hostname.includes('youtu.be'))return u.pathname.split('/').filter(Boolean)[0]||'';if(u.pathname.startsWith('/shorts/'))return u.pathname.split('/')[2]||'';if(u.pathname.startsWith('/embed/'))return u.pathname.split('/')[2]||'';return u.searchParams.get('v')||''}catch(e){return ''}};
 const splitTitle=t=>{const s=String(t||'');const m=s.split(/\s(?:—|â€”|–)\s/);return {title:(m[0]||s).trim(),artist:(m.slice(1).join(' — ')||'NAFSAM ARCHIVE').trim()}};
 let items=[],page={},visible=0,activeCard=null;
 const grid=document.getElementById('songs-grid'),more=document.getElementById('song-more'),count=document.getElementById('song-count');
 function applyUi(){
  document.documentElement.lang=lang;document.documentElement.dir=['ar','fa'].includes(lang)?'rtl':'ltr';
  document.getElementById('archive-label').textContent=T().archive;
  document.getElementById('page-title').textContent=T().title;
  document.getElementById('page-desc').textContent=T().desc;
  count.textContent=items.length?T().count(items.length):T().loading;
  more.textContent=T().more;
 }
 function stopActive(){
  if(!activeCard)return;
  const media=activeCard.querySelector('.song-wave'),id=activeCard.dataset.ytid,thumb=activeCard.dataset.thumb;
  if(media){media.innerHTML=(thumb?'<img loading="lazy" decoding="async" src="'+esc(thumb)+'" alt="">':'')+'<div class="wave-bars"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><span class="song-index">'+activeCard.dataset.num+'</span>'}
  activeCard.querySelector('.play')?.classList.remove('is-playing');
  activeCard=null;
  window.dispatchEvent(new Event('nafsam:resume-page-audio'));
 }
 function playIndex(idx){
  const card=grid.querySelector('[data-index="'+idx+'"]');if(!card)return;
  if(activeCard===card){stopActive();return}
  stopActive();
  const id=card.dataset.ytid,src=card.dataset.src,media=card.querySelector('.song-wave');
  window.dispatchEvent(new Event('nafsam:pause-page-audio'));
  if(id){
    const f=document.createElement('iframe');
    f.src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(id)+'?autoplay=1&playsinline=1&rel=0';
    f.title=card.dataset.title||'Song';f.allow='autoplay; encrypted-media; picture-in-picture';f.allowFullscreen=true;
    media.replaceChildren(f);
  }else if(src){
    const a=document.createElement('audio');a.controls=true;a.autoplay=true;a.src=src;a.style.width='90%';a.style.position='relative';a.style.zIndex='2';media.replaceChildren(a);
  }
  card.querySelector('.play')?.classList.add('is-playing');activeCard=card;
 }
 function renderBatch(){
  const end=Math.min(visible+12,items.length);
  for(let i=visible;i<end;i++){
    const e=items[i],id=youtubeId(e.src),thumb=e.thumb||(id?'https://i.ytimg.com/vi/'+encodeURIComponent(id)+'/hqdefault.jpg':'');
    const parts=splitTitle(e.title),story=page['song'+(i+1)+'_text']||'';
    const art=document.createElement('article');
    art.className='song-card glass-panel glass-panel-interactive rounded-xl p-6 relative overflow-hidden group';
    art.dataset.index=String(i);art.dataset.ytid=id;art.dataset.src=e.src||'';art.dataset.thumb=thumb;art.dataset.num=String(i+1).padStart(2,'0');art.dataset.title=e.title||'';
    art.innerHTML='<div class="absolute inset-0 bg-gradient-to-br from-primary/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none"></div>'+
      '<div class="relative z-10 flex justify-between items-start mb-6 gap-3"><div class="min-w-0"><h3 class="font-headline-sm text-on-surface mb-1 truncate">'+esc(parts.title)+'</h3><p class="song-source">'+esc(parts.artist)+'</p></div><span class="font-label-caps text-primary/50">MEM '+String(i+1).padStart(2,'0')+'</span></div>'+
      '<div class="song-wave">'+(thumb?'<img loading="lazy" decoding="async" src="'+esc(thumb)+'" alt="'+esc(e.title||'')+'">':'')+'<div class="wave-bars"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><span class="song-index">'+String(i+1).padStart(2,'0')+'</span></div>'+
      '<div class="relative z-10 mt-5"><div class="player-row"><span>0:00</span><input class="progress" max="100" min="0" type="range" value="0" disabled><span>--:--</span></div>'+
      '<div class="controls"><button type="button" class="material-symbols-outlined prev" aria-label="Previous">skip_previous</button><div class="flex items-center gap-4"><button type="button" class="material-symbols-outlined play" aria-label="'+esc(T().open)+'">play_circle</button></div><button type="button" class="material-symbols-outlined next" aria-label="Next">skip_next</button></div>'+
      (story?'<p class="song-story">'+esc(story)+'</p>':'')+
      '<a class="song-link" href="'+esc(e.src||'#')+'" target="_blank" rel="noopener noreferrer"><span class="material-symbols-outlined" style="font-size:16px">open_in_new</span>'+esc(T().source)+'</a></div>';
    art.querySelector('.play').onclick=()=>playIndex(i);
    art.querySelector('.prev').onclick=()=>playIndex((i-1+items.length)%items.length);
    art.querySelector('.next').onclick=()=>playIndex((i+1)%items.length);
    grid.appendChild(art);
  }
  visible=end;more.classList.toggle('hidden',visible>=items.length);
 }
 document.getElementById('lang-toggle').onclick=()=>{lang=langs[(langs.indexOf(lang)+1)%langs.length];try{localStorage.setItem('nafsam_language',lang)}catch(e){};location.reload()};
 more.onclick=renderBatch;
 applyUi();
 fetch('./nafsam-media.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(d=>{
  items=Array.isArray(d.songs)?d.songs.filter(x=>x&&x.src):[];
  page=d.archiveText?.pages?.[lang]||d.archiveText?.pages?.ar||d.archiveText?.pages?.tr||d.archiveText?.pages?.en||{};
  applyUi();renderBatch();
 }).catch(err=>{console.error('NAFSAM songs',err);count.textContent=T().error});
})();
</script>
