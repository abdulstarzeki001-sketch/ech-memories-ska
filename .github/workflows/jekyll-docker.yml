name: Deploy NAFSAM to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify TypeScript and navigation
        run: npm run check

      - name: Build complete public website
        run: npm run build

      - name: Verify published assets
        run: |
          test -f public/index.html
          test -f public/home.html
          test -f public/photos.html
          test -f public/journey.html
          test -f public/songs.html
          test -f public/videos.html
          test -f public/writings.html
          test -f public/feelings.html
          test -f public/nafsam-media.json
          test -f public/cosmic-system.css
          test -f public/cosmic-system.js
          test -f public/archive-private-viewer/index.html
          test -f public/future-lab/index.html
          ls public/future-lab/assets/*.js >/dev/null
          echo "NAFSAM static files and React bundle verified."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload built website (not repository source)
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
