name: Cloudflare Pages Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate TypeScript and navigation
        run: npm run check

      - name: Build static site
        run: npm run build

      - name: Verify Cloudflare output
        run: |
          test -f public/future-lab/index.html
          ls public/future-lab/assets/*.js >/dev/null
          test -f public/cosmic-system.css
          test -f public/cosmic-system.js
          test -f public/index.html
          test -f public/home.html
          test -f public/photos.html
          test -f public/journey.html
          test -f public/songs.html
          test -f public/videos.html
          test -f public/writings.html
          test -f public/feelings.html
          test -f public/nafsam-media.json
          test -f public/archive-private-viewer/index.html
          test -f public/archive-private-viewer/archive.enc.json
          test -f public/archive-private-viewer/files.enc.json
          test -f public/_headers
          test -f public/_redirects
          echo "Cloudflare Pages output is valid."

      - name: Deploy pull request preview to Cloudflare Pages
        if: ${{ github.event_name == 'pull_request' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_PROJECT_NAME != '' }}
        uses: cloudflare/wrangler-action@v4
        id: cloudflare_preview
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy public --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }} --branch=${{ github.head_ref }}

      - name: Preview configuration not available
        if: ${{ github.event_name == 'pull_request' && (env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' || env.CLOUDFLARE_PROJECT_NAME == '') }}
        run: |
          echo "### Cloudflare preview not started" >> "$GITHUB_STEP_SUMMARY"
          echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as secrets plus CLOUDFLARE_PAGES_PROJECT as an explicit repository variable; no default project is selected." >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to Cloudflare Pages
        if: ${{ github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_PROJECT_NAME != '' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: "4"
          command: pages deploy public --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }} --branch=main

      - name: Deployment credentials not configured
        if: ${{ github.event_name != 'pull_request' && (env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' || env.CLOUDFLARE_PROJECT_NAME == '') }}
        run: |
          echo "::warning::Cloudflare deployment skipped: configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets and CLOUDFLARE_PAGES_PROJECT repository variable."
          echo "### Cloudflare deploy not started" >> "$GITHUB_STEP_SUMMARY"
          echo "Cloudflare configuration is incomplete. Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets and CLOUDFLARE_PAGES_PROJECT repository variable; then rerun this workflow." >> "$GITHUB_STEP_SUMMARY"
