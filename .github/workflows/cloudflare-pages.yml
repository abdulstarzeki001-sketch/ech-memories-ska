name: Cloudflare Pages Build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'ech-nafasm-ska' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck cosmic React app
        run: npm run check:types

      - name: Build static site
        run: npm run build

      - name: Verify Cloudflare output
        run: |
          test -f public/index.html
          test -f public/cosmic/index.html
          test -f public/home.html
          test -f public/photos.html
          test -f public/journey.html
          test -f public/songs.html
          test -f public/videos.html
          test -f public/writings.html
          test -f public/feelings.html
          test -f public/nafsam-media.json
          test -f public/archive-private-viewer/index.html
          test -f public/archive-private-viewer/archive.enc.json
          test -f public/archive-private-viewer/files.enc.json
          test -f public/_headers
          test -f public/_redirects
          echo "Cloudflare Pages output is valid."

      - name: Deploy to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: "4"
          command: pages deploy public --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }} --branch=main

      - name: Deployment credentials not configured
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: |
          echo "::warning::Cloudflare deployment skipped: configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub repository secrets."
          echo "### Cloudflare deploy not started" >> "$GITHUB_STEP_SUMMARY"
          echo "Cloudflare credentials are missing. Configure repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; then rerun this workflow." >> "$GITHUB_STEP_SUMMARY"
