name: Cloudflare Pages Build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build static site
        run: npm run build

      - name: Verify Cloudflare output
        run: |
          test -f public/index.html
          test -f public/home.html
          test -f public/photos.html
          test -f public/journey.html
          test -f public/songs.html
          test -f public/videos.html
          test -f public/writings.html
          test -f public/feelings.html
          test -f public/nafsam-media.json
          test -f public/_headers
          test -f public/_redirects
          echo "Cloudflare Pages output is valid."

      - name: Deploy to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy public --project-name=ech-memories-ska --branch=main

      - name: Deployment credentials not configured
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: echo "Build passed. Cloudflare deployment is handled by the Pages Git integration until repository secrets are configured."
