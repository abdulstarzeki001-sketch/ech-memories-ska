<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#080b13"/>
<title>نفسم</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#070b12;
  --bg2:#0a1019;
  --gold:#e7bb77;
  --gold2:#c99549;
  --gold3:#f4d49a;
  --text:#f2ede7;
  --muted:#aaa49f;
  --line:rgba(231,187,119,.52);
  --glass:rgba(9,14,22,.72);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#05070c}
body{
  min-height:100vh;
  font-family:"Cairo",sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 50% 3%,rgba(38,72,112,.38),transparent 26%),
    radial-gradient(circle at 50% 25%,rgba(26,48,74,.35),transparent 35%),
    linear-gradient(180deg,#07101c 0%,#060a11 48%,#05070b 100%);
  overflow-x:hidden;
}
body::before{
  content:"";
  position:fixed;inset:0;pointer-events:none;
  background:
    radial-gradient(circle at 18% 28%,rgba(255,196,104,.055),transparent 20%),
    radial-gradient(circle at 80% 30%,rgba(255,196,104,.045),transparent 20%),
    radial-gradient(circle at 50% 92%,rgba(26,83,130,.18),transparent 22%);
  z-index:0;
}
.stars,.stars::before,.stars::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(circle,#f4d49a 1px,transparent 1.5px),
    radial-gradient(circle,#94c8ff 1px,transparent 1.5px);
  background-size:92px 92px,137px 137px;
  background-position:17px 9px,48px 70px;
  opacity:.18;
}
.stars::before{transform:scale(1.2);opacity:.11}
.stars::after{transform:scale(.85);opacity:.08}
.page{
  position:relative;z-index:2;
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:16px;
}
.frame{
  width:min(820px,100%);
  min-height:calc(100vh - 32px);
  position:relative;
  border:1px solid rgba(231,187,119,.50);
  border-radius:38px;
  background:
    linear-gradient(180deg,rgba(11,15,24,.88),rgba(6,10,17,.95));
  box-shadow:
    0 0 0 1px rgba(255,255,255,.015) inset,
    0 30px 100px rgba(0,0,0,.6);
  overflow:hidden;
  padding:44px 34px 34px;
}
.frame::before{
  content:"";
  position:absolute;inset:10px;
  border:1px solid rgba(231,187,119,.18);
  border-radius:30px;
  pointer-events:none;
}
.corner{position:absolute;width:42px;height:42px;opacity:.72}
.corner::before,.corner::after{content:"";position:absolute;background:var(--gold)}
.corner::before{width:42px;height:1px}.corner::after{width:1px;height:42px}
.c1{top:28px;left:28px}.c2{top:28px;right:28px;transform:scaleX(-1)}
.c3{bottom:28px;left:28px;transform:scaleY(-1)}.c4{bottom:28px;right:28px;transform:scale(-1)}
.hero{
  position:relative;
  text-align:center;
  padding:18px 22px 8px;
}
.moon{
  width:210px;height:125px;margin:0 auto -20px;
  position:relative;opacity:.7;filter:drop-shadow(0 0 24px rgba(108,164,220,.12));
}
.moon::before{
  content:"";position:absolute;left:50%;top:4px;transform:translateX(-50%);
  width:112px;height:112px;border-radius:50%;
  background:
    radial-gradient(circle at 38% 34%,#b9c8d8 0 8%,#8392a0 20%,#4f6170 47%,#283844 70%,#18232c 100%);
  box-shadow:0 0 40px rgba(160,205,255,.14);
}
.moon::after{
  content:"";position:absolute;left:50%;top:0;transform:translateX(-50%);
  width:185px;height:185px;border-radius:50%;border:1px solid rgba(231,187,119,.42);
}
.brand{
  font-family:"Amiri",serif;
  font-weight:700;
  font-size:clamp(54px,10vw,84px);
  color:var(--gold3);
  margin:0;
  line-height:1;
  text-shadow:0 2px 20px rgba(231,187,119,.18);
}
.sparkline{
  width:220px;height:24px;margin:10px auto 20px;position:relative;
}
.sparkline::before,.sparkline::after{
  content:"";position:absolute;top:50%;width:82px;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold));
}
.sparkline::before{left:0}.sparkline::after{right:0;transform:scaleX(-1)}
.sparkline span{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(45deg);
  width:13px;height:13px;border:1px solid var(--gold);background:#0b1017;
  box-shadow:0 0 18px rgba(231,187,119,.3);
}
.lead{
  margin:0 auto;
  max-width:680px;
  font-size:clamp(18px,3.6vw,28px);
  line-height:2.05;
  color:#e7e1db;
  font-weight:400;
}
.counter-box{
  margin:34px auto 0;
  padding:24px 22px 22px;
  border:1px solid rgba(231,187,119,.50);
  border-radius:30px;
  background:linear-gradient(180deg,rgba(9,14,23,.72),rgba(5,9,15,.82));
  box-shadow:0 18px 50px rgba(0,0,0,.26) inset;
}
.counter-title{
  color:var(--gold);font-size:21px;margin-bottom:20px;
  display:flex;align-items:center;justify-content:center;gap:14px;
}
.counter-title::before,.counter-title::after{content:"✦";font-size:14px;color:var(--gold3)}
.timer{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;direction:ltr}
.unit{
  direction:rtl;
  min-height:116px;
  border-radius:22px;
  border:1px solid rgba(231,187,119,.46);
  background:
    radial-gradient(circle at 50% 10%,rgba(231,187,119,.10),transparent 32%),
    linear-gradient(180deg,rgba(18,24,35,.8),rgba(11,16,24,.88));
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.unit strong{
  font-family:"Cairo";font-size:42px;line-height:1;color:#fff4e5;font-weight:700;
}
.unit span{font-size:15px;color:#c1b9b2;margin-top:10px}
.form{margin:34px 10px 0}
.name-wrap{
  height:72px;border-radius:26px;border:1px solid rgba(231,187,119,.55);
  background:linear-gradient(180deg,rgba(5,9,15,.90),rgba(6,10,16,.88));
  display:flex;align-items:center;padding:0 20px;gap:14px;
  box-shadow:0 0 25px rgba(231,187,119,.04) inset;
}
.icon{
  flex:0 0 44px;width:44px;height:44px;border-radius:50%;
  display:grid;place-items:center;border:1px solid rgba(231,187,119,.18);
  color:var(--gold);font-size:24px;
}
.name-input{
  flex:1;height:100%;border:0;outline:0;background:transparent;color:#f6f1eb;
  font:500 20px "Cairo";text-align:right;
}
.name-input::placeholder{color:#c5c0bb}
.enter{
  width:100%;height:74px;margin-top:24px;border-radius:30px;border:1px solid #f3d69c;
  background:
    linear-gradient(90deg,#e8c486 0%,#f3d79c 30%,#d6a85e 100%);
  color:#111015;font:700 28px "Cairo";cursor:pointer;
  box-shadow:0 7px 26px rgba(222,171,92,.24),inset 0 1px 0 rgba(255,255,255,.58);
  transition:transform .2s ease,filter .2s ease;
}
.enter:hover{transform:translateY(-1px);filter:brightness(1.05)}
.enter:active{transform:translateY(1px)}
.enter:disabled{opacity:.6;cursor:not-allowed}
.bottom{
  max-width:680px;margin:30px auto 6px;text-align:center;
  color:#bdb5ae;font-size:17px;line-height:2;
}
.bottom-mark{
  width:170px;height:20px;margin:0 auto 14px;position:relative;
}
.bottom-mark::before,.bottom-mark::after{
  content:"";position:absolute;top:50%;width:64px;height:1px;background:linear-gradient(90deg,transparent,var(--gold));
}
.bottom-mark::before{left:0}.bottom-mark::after{right:0;transform:scaleX(-1)}
.bottom-mark span{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(45deg);
  width:10px;height:10px;border:1px solid var(--gold);background:#080c13;
}
.error{
  display:none;margin-top:12px;text-align:center;color:#ffd0c9;
  font-size:13px;
}
.error.show{display:block}
@media(max-width:650px){
  .page{padding:8px}
  .frame{min-height:calc(100vh - 16px);padding:34px 18px 24px;border-radius:30px}
  .frame::before{inset:7px;border-radius:24px}
  .corner{width:28px;height:28px}
  .corner::before{width:28px}.corner::after{height:28px}
  .c1,.c2{top:20px}.c3,.c4{bottom:20px}.c1,.c3{left:20px}.c2,.c4{right:20px}
  .moon{width:160px;height:100px}
  .moon::before{width:90px;height:90px}.moon::after{width:145px;height:145px}
  .brand{font-size:58px}
  .lead{font-size:18px;line-height:1.95}
  .counter-box{padding:20px 12px 16px;margin-top:28px;border-radius:24px}
  .counter-title{font-size:18px}
  .timer{gap:8px}
  .unit{min-height:96px;border-radius:18px}
  .unit strong{font-size:32px}.unit span{font-size:13px}
  .form{margin:28px 4px 0}
  .name-wrap{height:64px;border-radius:22px}
  .name-input{font-size:18px}
  .enter{height:66px;font-size:24px;border-radius:26px}
  .bottom{font-size:15px}
}
@media(max-width:430px){
  .hero{padding-left:4px;padding-right:4px}
  .timer{grid-template-columns:repeat(4,1fr);gap:6px}
  .unit{min-height:90px;padding:8px 2px}.unit strong{font-size:28px}.unit span{font-size:12px}
  .lead{font-size:17px}
}
</style>



<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2"/>
<link rel="icon" type="image/png" href="/apple-touch-icon.png?v=2"/>
<link rel="manifest" href="/manifest.webmanifest?v=2"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="نفسم"/>
<link rel="stylesheet" href="./mobile-responsive.css?v=3">
</head>
<body>
<div class="stars"></div>
<main class="page">
<section class="frame">
  <i class="corner c1"></i><i class="corner c2"></i><i class="corner c3"></i><i class="corner c4"></i>

  <div class="hero">
    <div class="moon" aria-hidden="true"></div>
    <h1 class="brand">نفسم</h1>
    <div class="sparkline"><span></span></div>
    <p class="lead">
      مر زمن منذ أن بدأ حبك ينزف من قلبي، وأنا أتعلم كيف<br class="wide"/>
      يعيش الإنسان بقلبٍ مكسورٍ لا يتوقف عن الخفقان.
    </p>
  </div>

  <section class="counter-box">
    <div class="counter-title">مرّ على البداية</div>
    <div class="timer">
      <div class="unit"><strong id="seconds">53</strong><span>ثانية</span></div>
      <div class="unit"><strong id="minutes">24</strong><span>دقيقة</span></div>
      <div class="unit"><strong id="hours">01</strong><span>ساعة</span></div>
      <div class="unit"><strong id="days">132</strong><span>يوم</span></div>
    </div>
  </section>

  <form class="form" id="entryForm">
    <div class="name-wrap">
      <span class="icon">♙</span>
      <input id="visitorName" class="name-input" type="text" maxlength="40" autocomplete="name" placeholder="اختر الاسم"/>
    </div>
    <button class="enter" id="enterBtn" type="submit">افتح ما تبقّى</button>
    <div class="error" id="errorBox">اكتب الاسم أولًا.</div>
  </form>

  <div class="bottom">
    <div class="bottom-mark"><span></span></div>
    أقسى ما في الأمر أن حبك لم يغادرني، بل خرج من قلبي وهو يمزق كل شيءٍ كان جميلًا بداخلي
  </div>
</section>
</main>

<script>
(()=>{
  const START_DATE="2026-05-29T00:00:00+03:00";
  const pad=n=>String(n).padStart(2,"0");
  const el=id=>document.getElementById(id);
  function tick(){
    let d=Math.max(0,Date.now()-new Date(START_DATE).getTime());
    const days=Math.floor(d/86400000);d%=86400000;
    const hours=Math.floor(d/3600000);d%=3600000;
    const minutes=Math.floor(d/60000);d%=60000;
    const seconds=Math.floor(d/1000);
    el("days").textContent=days;
    el("hours").textContent=pad(hours);
    el("minutes").textContent=pad(minutes);
    el("seconds").textContent=pad(seconds);
  }
  tick();setInterval(tick,1000);

  const form=el("entryForm"),input=el("visitorName"),btn=el("enterBtn"),err=el("errorBox");
  try{const saved=localStorage.getItem("nafsam_visitor_name");if(saved)input.value=saved}catch(e){}
  input.addEventListener("input",()=>{if(input.value.trim())err.classList.remove("show")});
  form.addEventListener("submit",e=>{
    e.preventDefault();
    const name=input.value.trim();
    if(!name){err.classList.add("show");input.focus();return}
    try{localStorage.setItem("nafsam_visitor_name",name)}catch(e){}
    btn.disabled=true;btn.textContent="جارِ فتح الأرشيف...";
    document.body.style.transition="opacity .4s ease";
    document.body.style.opacity="0";
    setTimeout(()=>location.href="./home.html",420);
  });
})();
</script>
<script src="./i18n.js"></script><script src="./page-audio.js"></script><script src="./mobile-touch.js?v=3" defer></script>
</body>
</html>
